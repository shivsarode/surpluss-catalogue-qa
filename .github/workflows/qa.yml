name: QA Tests

on:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalogue
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d catalogue"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/catalogue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy database
        run: npm run db:deploy

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Business and validation tests
        run: >
          npx vitest run
          tests/api-access-control.test.ts
          tests/enquiry-validation.test.ts
          tests/price-discount.test.ts
          tests/spreadsheet-import.test.ts

      - name: Known bug reproduction tests
        continue-on-error: true
        run: >
          npx vitest run
          tests/catalogue-lifecycle.test.ts
          tests/draft-catalogue-access.test.ts
          tests/id-tampering.test.ts
          tests/server-actions-access.test.ts
          tests/staff-publish.test.ts

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
